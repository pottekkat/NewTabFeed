name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Cache the Playwright browser download (keyed on the pinned Playwright
      # version) so component + e2e runs don't re-fetch Chromium every time.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Component tests
        run: pnpm test:components

      - name: End-to-end tests
        run: pnpm test:e2e

      # `wxt zip` runs its own production build, so this packages the NORMAL
      # manifest (no host_permissions), not the WXT_E2E build left in .output.
      - name: Package extension
        run: pnpm zip

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: newtabfeed-chrome-mv3
          path: .output/*.zip
          if-no-files-found: error
